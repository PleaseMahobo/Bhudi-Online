name: Build Windows Support Client

on:
  push:
    branches: [main]
    paths:
      - "agent/support-client/**"
      - ".github/workflows/build-support-client.yml"
  pull_request:
    paths:
      - "agent/support-client/**"
      - ".github/workflows/build-support-client.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: agent/support-client/go.sum
      - name: Download modules
        working-directory: agent/support-client
        run: go mod download
      - name: Verify modules
        working-directory: agent/support-client
        run: go mod verify
      - name: Build Windows x64 support client
        working-directory: agent/support-client
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w" -o bhudi-support.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: bhudi-support-client-windows-amd64
          path: agent/support-client/bhudi-support.exe
