name: Bhudi Agent Release

# Manual only — avoids racing build-agent-setup on every main push.
# Use for enrollment-checked Windows installer + support client release.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-agent:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: |
            agent/native/go.sum
            agent/support-client/go.sum

      - name: Verify customer enrollment bootstrap is included
        working-directory: agent/native
        shell: pwsh
        run: |
          if (-not (Test-Path enrollment_bootstrap.go)) {
            throw "enrollment_bootstrap.go is missing from the native agent build"
          }

      - name: Build native Windows agent
        working-directory: agent/native
        shell: pwsh
        run: |
          go mod download
          go mod verify
          New-Item -ItemType Directory -Force dist | Out-Null
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          $env:CGO_ENABLED = "0"
          go build -ldflags="-s -w" -o dist/bhudi-agent-windows-amd64.exe .
          Copy-Item dist/bhudi-agent-windows-amd64.exe dist/bhudi-agent.exe

      - name: Bundle exact native agent into customer installer
        shell: pwsh
        run: |
          Copy-Item agent/native/dist/bhudi-agent.exe agent/cmd/bhudi-agent-setup/bhudi-agent.exe -Force

      - name: Build customer installer base
        working-directory: agent/cmd/bhudi-agent-setup
        shell: pwsh
        run: |
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          $env:CGO_ENABLED = "0"
          go build -tags release -ldflags="-s -w" -o ../../native/dist/BhudiAgent-Setup.exe .

      - name: Build Windows support client
        working-directory: agent/support-client
        shell: pwsh
        run: |
          go mod download
          go mod verify
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          $env:CGO_ENABLED = "0"
          go build -trimpath -ldflags="-s -w" -o bhudi-support.exe .

      - name: Upload Windows agent artifact
        uses: actions/upload-artifact@v4
        with:
          name: bhudi-agent-windows
          path: |
            agent/native/dist/bhudi-agent.exe
            agent/native/dist/bhudi-agent-windows-amd64.exe
            agent/native/dist/BhudiAgent-Setup.exe
            agent/support-client/bhudi-support.exe

      - name: Publish agent release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: agent-native-latest
          name: Bhudi Native Agent
          body: |
            Customer-specific installer base, native Windows agent, and support client.
            Triggered via workflow_dispatch (enrollment-checked Windows build).
          files: |
            agent/native/dist/BhudiAgent-Setup.exe
            agent/native/dist/bhudi-agent.exe
            agent/native/dist/bhudi-agent-windows-amd64.exe
            agent/support-client/bhudi-support.exe
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
