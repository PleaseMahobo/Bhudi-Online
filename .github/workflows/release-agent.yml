# Enterprise agent release: native binaries (Win/Linux/macOS) + Windows MSI + setup EXE
# MSI toolchain: WiX 5 only (matches agent/msi/Product.wxs)
name: Release Native Agent

on:
  workflow_dispatch:
  push:
    tags:
      - 'agent-v*'
    paths:
      - 'agent/native/**'
      - 'agent/cmd/bhudi-agent-setup/**'
      - 'agent/msi/**'
      - 'agent/support-client/**'
      - '.github/workflows/release-agent.yml'

permissions:
  contents: write

env:
  AGENT_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '2.2.1' }}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build native Windows agent
        working-directory: agent/native
        shell: pwsh
        run: |
          $ver = "${{ env.AGENT_VERSION }}".TrimStart('agent-v')
          if (-not $ver) { $ver = "2.2.0" }
          New-Item -ItemType Directory -Force dist | Out-Null
          $ld = "-s -w -X main.agentVersion=$ver"
          $env:CGO_ENABLED = "0"
          $env:GOOS = "windows"; $env:GOARCH = "amd64"
          go build -trimpath -ldflags $ld -o dist/bhudi-agent.exe .
          Copy-Item dist/bhudi-agent.exe dist/bhudi-agent-windows-amd64.exe

      - name: Build customer installer base (BhudiAgent-Setup.exe)
        shell: pwsh
        run: |
          Copy-Item agent/native/dist/bhudi-agent.exe agent/cmd/bhudi-agent-setup/bhudi-agent.exe -Force
          Push-Location agent/cmd/bhudi-agent-setup
          $env:CGO_ENABLED = "0"
          $env:GOOS = "windows"; $env:GOARCH = "amd64"
          go build -tags release -trimpath -ldflags "-s -w -H=windowsgui" -o ../../native/dist/BhudiAgent-Setup.exe .
          Pop-Location

      - name: Build support client
        working-directory: agent/support-client
        shell: pwsh
        run: |
          $env:CGO_ENABLED = "0"
          $env:GOOS = "windows"; $env:GOARCH = "amd64"
          go build -trimpath -ldflags "-s -w -H=windowsgui" -o ../native/dist/bhudi-support.exe .
          if (-not (Test-Path ../native/dist/bhudi-support.exe)) { throw "bhudi-support.exe build failed" }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install WiX 5
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2

      - name: Build MSI (WiX 5)
        working-directory: agent/msi
        shell: pwsh
        run: |
          Copy-Item ..\native\dist\bhudi-agent.exe . -Force
          Copy-Item ..\native\dist\bhudi-support.exe . -Force
          wix build Product.wxs -ext WixToolset.UI.wixext -d AgentDir=. -o ..\native\dist\bhudi-agent-setup.msi
          if ($LASTEXITCODE -ne 0) { throw "wix build failed" }
          Get-Item ..\native\dist\bhudi-agent-setup.msi

      - name: Optional Authenticode sign (if cert secrets present)
        shell: pwsh
        env:
          SIGN_CERT_BASE64: ${{ secrets.WINDOWS_SIGN_CERT_BASE64 }}
          SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERT_PASSWORD }}
        run: |
          if (-not $env:SIGN_CERT_BASE64) {
            Write-Host "Skipping code sign (WINDOWS_SIGN_CERT_BASE64 not set)"
            exit 0
          }
          $pfx = "$env:RUNNER_TEMP\bhudi-sign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_CERT_BASE64))
          $files = @(
            "agent\native\dist\bhudi-agent.exe",
            "agent\native\dist\BhudiAgent-Setup.exe",
            "agent\native\dist\bhudi-agent-setup.msi",
            "agent\native\dist\bhudi-support.exe"
          )
          foreach ($f in $files) {
            if (Test-Path $f) {
              signtool sign /f $pfx /p $env:SIGN_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $f
            }
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-agent
          path: |
            agent/native/dist/bhudi-agent.exe
            agent/native/dist/bhudi-agent-windows-amd64.exe
            agent/native/dist/BhudiAgent-Setup.exe
            agent/native/dist/bhudi-agent-setup.msi
            agent/native/dist/bhudi-support.exe

  build-unix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            out: bhudi-agent-linux-amd64
          - goos: linux
            goarch: arm64
            out: bhudi-agent-linux-arm64
          - goos: darwin
            goarch: amd64
            out: bhudi-agent-darwin-amd64
          - goos: darwin
            goarch: arm64
            out: bhudi-agent-darwin-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build
        working-directory: agent/native
        run: |
          VER="${{ env.AGENT_VERSION }}"
          VER="${VER#agent-v}"
          [ -n "$VER" ] || VER=2.2.1
          mkdir -p dist
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags="-s -w -X main.agentVersion=$VER" \
            -o dist/${{ matrix.out }} .
      - uses: actions/upload-artifact@v4
        with:
          name: unix-${{ matrix.out }}
          path: agent/native/dist/${{ matrix.out }}

  publish:
    needs: [build-windows, build-unix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f -exec cp -v {} release/ \;
          ls -la release
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: agent-native-latest
          name: Bhudi Native Agent (enterprise)
          body: |
            ## Enterprise native agent

            | File | Platform |
            |------|----------|
            | `BhudiAgent-Setup.exe` | Windows customer installer (portal injects enrollment) |
            | `bhudi-agent-setup.msi` | Windows MSI — Intune/GPO (`SERVERURL=` + optional `ENROLLMENTTOKEN=`) |
            | `bhudi-agent.exe` | Windows x64 binary |
            | `bhudi-support.exe` | Windows tray / tickets |
            | `bhudi-agent-linux-*` | Linux |
            | `bhudi-agent-darwin-*` | macOS |

            ### Silent MSI
            ```bat
            msiexec /i bhudi-agent-setup.msi /qn SERVERURL=https://bhudi-online-production.up.railway.app ENROLLMENTTOKEN=...
            ```

            ### Customer EXE
            Download from the Bhudi portal — token is injected automatically.
          files: release/*
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
