name: Build Bhudi Windows Agent Installer

on:
  workflow_dispatch:
  push:
    paths:
      - 'agent/native/**'
      - 'agent/installer/**'
      - '.github/workflows/build-bhudi-agent-installer.yml'

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: agent/native
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: agent/native/go.sum

      - name: Build native Windows agent
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go mod download
          go build -trimpath -ldflags "-s -w" -o bhudi-agent.exe .
          if (-not (Test-Path .\bhudi-agent.exe)) { throw 'Native agent build did not produce bhudi-agent.exe' }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build Windows installer
        shell: pwsh
        working-directory: .
        run: |
          $ErrorActionPreference = 'Stop'
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' 'agent\installer\BhudiAgent.iss'
          if (-not (Test-Path 'agent\dist\BhudiAgent-Setup.exe')) { throw 'Installer build did not produce BhudiAgent-Setup.exe' }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: BhudiAgent-Windows-x64
          path: agent/dist/BhudiAgent-Setup.exe
          if-no-files-found: error

      - name: Upload native agent artifact
        uses: actions/upload-artifact@v4
        with:
          name: BhudiAgent-Native-Windows-x64
          path: agent/native/bhudi-agent.exe
          if-no-files-found: error
