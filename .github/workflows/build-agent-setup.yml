# Native agent builds (Windows / Linux / macOS) + MSI + GitHub Release
name: Build Native Agents (Windows / Linux / macOS)

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "agent/native/**"
      - "agent/cmd/bhudi-agent-setup/**"
      - "agent/support-client/**"
      - "agent/msi/**"
      - ".github/workflows/build-agent-setup.yml"
  workflow_dispatch:
  repository_dispatch:
    types: [native-installer-rebuild]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: |
            agent/native/go.sum
            agent/support-client/go.sum
            agent/cmd/bhudi-agent-setup/go.sum

      - name: Resolve native modules (incl. gopsutil)
        working-directory: agent/native
        run: |
          go get github.com/shirou/gopsutil/v3@v3.24.5
          go mod tidy
          go mod download
          go mod verify

      - name: Build native binaries
        working-directory: agent/native
        run: |
          mkdir -p dist
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w -X main.agentVersion=2.2.8" -o dist/bhudi-agent-windows-amd64.exe .
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/bhudi-agent-linux-amd64 .
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/bhudi-agent-linux-arm64 .
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/bhudi-agent-darwin-amd64 .
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/bhudi-agent-darwin-arm64 .
          cp dist/bhudi-agent-windows-amd64.exe dist/bhudi-agent.exe

      - name: Build Support Client (Windows tray / tickets)
        working-directory: agent/support-client
        run: |
          go mod download || true
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w -H=windowsgui" -o ../native/dist/bhudi-support.exe .
          test -s ../native/dist/bhudi-support.exe

      - name: Stage native agent and support client for complete installer embedding
        run: |
          cp agent/native/dist/bhudi-agent.exe agent/cmd/bhudi-agent-setup/bhudi-agent.exe
          cp agent/native/dist/bhudi-support.exe agent/cmd/bhudi-agent-setup/bhudi-support.exe
          test -s agent/cmd/bhudi-agent-setup/bhudi-agent.exe
          test -s agent/cmd/bhudi-agent-setup/bhudi-support.exe

      - name: Resolve installer modules (MessageBox via x/sys — no walk)
        working-directory: agent/cmd/bhudi-agent-setup
        run: |
          go get golang.org/x/sys@v0.30.0
          go mod tidy
          go mod download

      - name: Prove embedded agent byte integrity
        working-directory: agent/cmd/bhudi-agent-setup
        run: |
          go test -tags release ./... -run 'TestBundledAgentMatchesStagedBinary|TestBootstrapContract' -count=1

      - name: Build customer installer base with embedded native agent
        working-directory: agent/cmd/bhudi-agent-setup
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -tags release -ldflags="-s -w -H=windowsgui" -o ../../native/dist/BhudiAgent-Setup.exe .

      - name: Verify installer build inputs and bootstrap parser
        run: |
          test -s agent/native/dist/BhudiAgent-Setup.exe
          test -s agent/cmd/bhudi-agent-setup/bhudi-agent.exe
          test -s agent/native/dist/bhudi-support.exe
          strings agent/native/dist/BhudiAgent-Setup.exe | grep -q 'BHUDI_BOOTSTRAP_V1'

      - uses: actions/upload-artifact@v4
        with:
          name: bhudi-agent-native
          path: agent/native/dist/*

      - name: Publish native release assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: agent-native-latest
          name: Bhudi Native Agent (no Python)
          body: |
            ## Standalone agents

            | File | Notes |
            |------|-------|
            | `BhudiAgent-Setup.exe` | Windows installer v2.2.8 with authenticated agent polling and bundled system-tray support client |
            | `bhudi-agent-setup.msi` | Intune/GPO |
            | `bhudi-agent.exe` / `bhudi-support.exe` | Binaries |

            Portal download embeds enrollment automatically.
          files: |
            agent/native/dist/BhudiAgent-Setup.exe
            agent/native/dist/bhudi-agent.exe
            agent/native/dist/bhudi-agent-windows-amd64.exe
            agent/native/dist/bhudi-support.exe
            agent/native/dist/bhudi-agent-linux-amd64
            agent/native/dist/bhudi-agent-linux-arm64
            agent/native/dist/bhudi-agent-darwin-amd64
            agent/native/dist/bhudi-agent-darwin-arm64
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  msi:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bhudi-agent-native
          path: agent/native/dist
      - name: Stage agent + support client for WiX
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force agent\msi | Out-Null
          Copy-Item agent\native\dist\bhudi-agent.exe agent\msi\bhudi-agent.exe -Force
          if (-not (Test-Path agent\native\dist\bhudi-support.exe)) {
            throw "bhudi-support.exe missing"
          }
          Copy-Item agent\native\dist\bhudi-support.exe agent\msi\bhudi-support.exe -Force
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install WiX 5
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
      - name: Build MSI (WiX 5)
        working-directory: agent/msi
        run: wix build Product.wxs -ext WixToolset.UI.wixext -d AgentDir=. -o bhudi-agent-setup.msi
      - uses: actions/upload-artifact@v4
        with:
          name: bhudi-agent-msi
          path: agent/msi/bhudi-agent-setup.msi
      - name: Publish MSI release asset
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: agent-native-latest
          files: agent/msi/bhudi-agent-setup.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
