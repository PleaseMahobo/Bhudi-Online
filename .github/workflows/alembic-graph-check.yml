name: Alembic Migration Graph Check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/alembic/**'
      - 'backend/requirements.txt'
      - '.github/workflows/alembic-graph-check.yml'

jobs:
  alembic-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: bhudi_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d bhudi_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/bhudi_ci
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt
      - name: Validate migration graph
        run: |
          alembic heads
          alembic branches
          alembic history --verbose
          count=$(alembic heads | grep -F -c '(head)' || true)
          echo "Alembic head count: $count"
          test "$count" -eq 1
      - name: Prepare pre-RMM schema baseline in disposable PostgreSQL
        run: |
          python - <<'PY'
          from sqlalchemy import text
          from app.core.bootstrap import engine
          from app.models.base import Base

          # The repository's historical base migration assumes tables that
          # already exist in deployed installations. Build the current ORM
          # baseline, then remove only the four columns introduced by Phase 1.
          Base.metadata.create_all(bind=engine)
          with engine.begin() as connection:
              connection.execute(text(
                  "ALTER TABLE devices DROP COLUMN IF EXISTS organization_id, "
                  "DROP COLUMN IF EXISTS site_id"
              ))
              connection.execute(text(
                  "ALTER TABLE agents DROP COLUMN IF EXISTS organization_id, "
                  "DROP COLUMN IF EXISTS site_id"
              ))
          PY
          alembic stamp m7n8o9p0q1r2
      - name: Apply migrations to disposable PostgreSQL
        run: alembic upgrade head
      - name: Verify canonical RMM schema and revision
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, inspect, text

          engine = create_engine(os.environ["DATABASE_URL"])
          inspector = inspect(engine)
          for table in ("agents", "devices"):
              columns = {column["name"] for column in inspector.get_columns(table)}
              missing = {"organization_id", "site_id"} - columns
              assert not missing, f"{table} missing canonical columns: {sorted(missing)}"

          with engine.connect() as connection:
              revision = connection.execute(text("SELECT version_num FROM alembic_version")).scalar_one()
          assert revision == "rmm_phase1_org_site_device_agent", revision
          print(f"PostgreSQL migration verified at {revision}")
          PY
