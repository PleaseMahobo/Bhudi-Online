name: Alembic Migration Graph Check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/alembic/**'
      - 'backend/requirements.txt'
      - '.github/workflows/alembic-graph-check.yml'

jobs:
  alembic-graph:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - run: alembic heads
      - run: alembic branches
      - run: alembic history --verbose
      - name: Require exactly one canonical head
        shell: bash
        run: |
          count=$(alembic heads | grep -E '^[0-9a-f]+' | wc -l | tr -d ' ')
          echo "Alembic head count: $count"
          test "$count" -eq 1
      - run: alembic upgrade head --sql
