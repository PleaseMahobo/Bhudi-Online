# Grafana + Prometheus for Bhudi
#   cd deploy/grafana && docker compose up -d
# Grafana: http://localhost:3001  Prometheus: http://localhost:9090

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001}
      GF_INSTALL_PLUGINS: grafana-clock-panel
      # Optional: pre-seed Postgres vars for provisioning (edit datasources.yml)
      BHUDI_PG_HOST: ${BHUDI_PG_HOST:-}
      BHUDI_PG_USER: ${BHUDI_PG_USER:-postgres}
      BHUDI_PG_PASSWORD: ${BHUDI_PG_PASSWORD:-}
      BHUDI_PG_DATABASE: ${BHUDI_PG_DATABASE:-postgres}
      BHUDI_PG_SSLMODE: ${BHUDI_PG_SSLMODE:-require}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  grafana-data:
  prometheus-data:
