apiVersion: 1

deleteDatasources:
  - name: Prometheus
    orgId: 1

datasources:
  # --- Prometheus (API /metrics scrape) ---
  - name: Prometheus
    type: prometheus
    access: proxy
    uid: prometheus
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      httpMethod: POST
      timeInterval: 15s

  # --- Postgres / Supabase (device_metrics history) ---
  # Configure via Grafana UI if env substitution is empty, or set:
  #   BHUDI_PG_HOST=db.xxxxx.supabase.co:5432
  #   BHUDI_PG_USER=postgres
  #   BHUDI_PG_PASSWORD=...
  #   BHUDI_PG_DATABASE=postgres
  #   BHUDI_PG_SSLMODE=require
  - name: Bhudi Postgres
    type: postgres
    access: proxy
    uid: bhudi-postgres
    url: ${BHUDI_PG_HOST}
    user: ${BHUDI_PG_USER}
    secureJsonData:
      password: ${BHUDI_PG_PASSWORD}
    jsonData:
      database: ${BHUDI_PG_DATABASE}
      sslmode: ${BHUDI_PG_SSLMODE}
      postgresVersion: 1500
      timescaledb: false
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
    editable: true
