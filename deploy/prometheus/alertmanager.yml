global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: [alertname, severity, team]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="critical"
      receiver: critical
      continue: true
    - matchers:
        - team="security"
      receiver: security

receivers:
  - name: default
    # Local file webhook / logs — replace with Slack/email for production
    webhook_configs:
      - url: http://127.0.0.1:5001/webhook
        send_resolved: true

  - name: critical
    webhook_configs:
      - url: http://127.0.0.1:5001/webhook
        send_resolved: true
    # Example Slack (uncomment and set):
    # slack_configs:
    #   - api_url: ${SLACK_WEBHOOK_URL}
    #     channel: '#bhudi-alerts'
    #     title: '{{ .Status | toUpper }} {{ .CommonLabels.alertname }}'
    #     text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'

  - name: security
    webhook_configs:
      - url: http://127.0.0.1:5001/webhook
        send_resolved: true

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: [alertname, job]
