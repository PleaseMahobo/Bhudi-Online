global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Local docker compose API
  - job_name: bhudi-api
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets: ["api:8000"]
        labels:
          env: local

  # Production (Railway) — replace host or use scrape via external probe
  - job_name: bhudi-api-production
    metrics_path: /metrics
    scheme: https
    scrape_interval: 30s
    static_configs:
      - targets: ["bhudi-online-production.up.railway.app"]
        labels:
          env: production

  # Optional OTel collector metrics
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
