# Bhudi RMM — coturn (STUN/TURN) configuration
# Used when WebRTC peers (agent ↔ browser) cannot connect peer-to-peer.
#
# Install (Ubuntu/Debian):
#   sudo apt update && sudo apt install -y coturn
#   sudo cp deploy/coturn/turnserver.conf /etc/turnserver.conf
#   sudo systemctl enable --now coturn
#
# DNS:
#   turn.bhudi.online  A/AAAA  → this server's public IP
#
# Firewall (UDP is critical for media):
#   3478/tcp  3478/udp
#   5349/tcp  5349/udp   (TLS TURN, optional)
#   49152-65535/udp      (relay ports — or narrow via min/max below)

listening-port=3478
tls-listening-port=5349

# Public IP of this TURN host (REQUIRED on cloud VMs)
# external-ip=YOUR.PUBLIC.IP
# listening-ip=0.0.0.0
# relay-ip=YOUR.PUBLIC.IP

fingerprint
lt-cred-mech

# Long-term credentials (change these)
user=bhudi:CHANGE_ME_STRONG_PASSWORD
realm=bhudi.online

# Restrict relay port range (easier firewalling)
min-port=49160
max-port=49200

# Logging
verbose
log-file=/var/log/turnserver.log
simple-log

# Security hardening
no-multicast-peers
no-cli
# no-tls / no-dtls until certs are configured
no-tls
no-dtls

# Optional TLS (recommended in production)
# cert=/etc/letsencrypt/live/turn.bhudi.online/fullchain.pem
# pkey=/etc/letsencrypt/live/turn.bhudi.online/privkey.pem
# After certs: remove no-tls / no-dtls and prefer turns: URLs

# Deny loopback / private peers where appropriate
# denied-peer-ip=10.0.0.0-10.255.255.255
# denied-peer-ip=192.168.0.0-192.168.255.255
# denied-peer-ip=172.16.0.0-172.31.255.255

total-quota=100
user-quota=10
