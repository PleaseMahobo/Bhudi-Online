# Bhudi RMM — nginx reverse proxy with WebSocket support
# Place on the host that terminates TLS for api.bhudi.online (or similar).
#
# Upstream should be the FastAPI process (Railway private URL, Docker service,
# or 127.0.0.1:8080 if co-located).
#
# Required for remote-access streams:
#   /api/v1/remote-access/sessions/*/dashboard
#   /api/v1/remote-access/sessions/*/agent/*
#   /ws  /ws/alerts  /ws/*

upstream bhudi_api {
    # Replace with your API target
    server 127.0.0.1:8080;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Optional rate limit zones
limit_req_zone $binary_remote_addr zone=bhudi_api_req:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=bhudi_api_conn:10m;

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.bhudi.online;

    # ssl_certificate     /etc/letsencrypt/live/api.bhudi.online/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.bhudi.online/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;

    client_max_body_size 50m;

    # Long-lived remote desktop / agent streams
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_connect_timeout 60s;

    # ---- WebSocket + API (FastAPI) ----
    location / {
        limit_req zone=bhudi_api_req burst=60 nodelay;
        limit_conn bhudi_api_conn 40;

        proxy_pass http://bhudi_api;
        proxy_http_version 1.1;

        # WebSocket upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
    }

    # Explicit remote-access stream paths (same upstream; documents intent)
    location ~ ^/api/v1/remote-access/sessions/ {
        proxy_pass http://bhudi_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /ws {
        proxy_pass http://bhudi_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /health {
        proxy_pass http://bhudi_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name api.bhudi.online;
    return 301 https://$host$request_uri;
}
