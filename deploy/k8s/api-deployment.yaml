apiVersion: apps/v1
kind: Deployment
metadata:
  name: bhudi-api
  labels:
    app: bhudi-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bhudi-api
  template:
    metadata:
      labels:
        app: bhudi-api
    spec:
      containers:
        - name: api
          image: ghcr.io/pleasemahobo/bhudi-online-api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: bhudi-api-secrets
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: bhudi-api
spec:
  selector:
    app: bhudi-api
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bhudi-api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bhudi-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
